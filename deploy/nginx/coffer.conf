# Generated from deploy/headers.json by `pnpm deploy:build` (ADR-010). Do not edit by hand.
# Copy to /etc/nginx/conf.d/, put the files of dist/ in the root below, and serve it over HTTPS.

map "$status:$uri" $coffer_cache_control {
    default "";
    "~^(200|206|304):/assets/" "public, max-age=31536000, immutable";
    "~^(200|206|304):/fonts/" "public, max-age=31536000, immutable";
    "~^(200|206|304):/icons/" "public, max-age=31536000, immutable";
    "~^(200|206|304):/favicon\\.svg$" "public, max-age=31536000, immutable";
    "~^(200|206|304):/$" "no-cache";
    "~^(200|206|304):/index\\.html$" "no-cache";
    "~^(200|206|304):/theme-init\\.js$" "no-cache";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # A location that adds a header of its own stops inheriting these: add none there.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src blob: https:; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cache-Control $coffer_cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Types that older mime.types files do not list.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
    }
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # The Cloudflare and Netlify header file is not part of the site here.
    location = /_headers {
        return 404;
    }
}
