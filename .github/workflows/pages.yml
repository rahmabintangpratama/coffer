# GitHub Pages, the degraded tier (ADR-010, docs/deploy/github-pages.md): no response headers, so the policy is a meta
# element and several protections are lost. Use a custom domain or a <account>.github.io repository that holds only
# Coffer: a project site shares its origin with the account's other sites. Off until the owner turns it on: it runs only by hand, and only when the
# repository variable COFFER_PAGES is "true" and Pages is set to "GitHub Actions" as its source.
name: GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.COFFER_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: pnpm build && pnpm dist:check && pnpm size:check
        env:
          COFFER_TARGET: github-pages
          # "" for a user site or a custom domain, "/<repository>" for a project site.
          COFFER_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
