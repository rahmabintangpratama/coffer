name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Local S3 fixture for the integration tests. Fake credentials only.
    # Same image and settings as tests/integration/docker-compose.yml (C-48).
    services:
      s3:
        image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a # 1.0.6
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: coffer-test-key
          RUSTFS_SECRET_KEY: coffer-test-secret-not-real
          RUSTFS_CONSOLE_ENABLE: "false"
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            from="$PR_BASE"; to="$PR_HEAD"
          else
            from="$PUSH_BEFORE"; to="$PUSH_HEAD"
          fi
          # A new branch or a base that is not in the clone: check the tip commit only.
          if ! git cat-file -e "${from}^{commit}" 2>/dev/null; then from="${to}~1"; fi
          pnpm exec commitlint --from "$from" --to "$to" --verbose

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Copy keys
        run: pnpm copy:check

      - name: Token CSS is current
        run: pnpm tokens:check

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Bundle budgets
        run: pnpm size:check

      - name: Host configurations match deploy/headers.json
        run: pnpm deploy:check

      - name: Security headers
        run: pnpm headers:check

      - name: Built files are only what C-22 allows
        run: pnpm dist:check

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  # One job per browser and width: each runs in about a fifth of the time the whole matrix took in one job,
  # and a failure names the engine and the viewport. Reports are merged in e2e-report.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-375, chromium-768, chromium-1440, webkit-375, webkit-768, webkit-1440, firefox-375, firefox-1440]

    # Local S3 fixture for the integration tests. Fake credentials only.
    # Same image and settings as tests/integration/docker-compose.yml (C-48).
    services:
      s3:
        image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a # 1.0.6
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: coffer-test-key
          RUSTFS_SECRET_KEY: coffer-test-secret-not-real
          RUSTFS_CONSOLE_ENABLE: "false"
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ startsWith(matrix.project, 'webkit') && 'webkit' || startsWith(matrix.project, 'firefox') && 'firefox' || 'chromium' }}

      - name: End-to-end tests (${{ matrix.project }})
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 7

      # The real-browser contrast results (tests/e2e/contrast.spec.ts runs in the 1440 projects); `pnpm contrast:report` turns them into docs/contrast-report.md.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && endsWith(matrix.project, '-1440')
        with:
          name: contrast-${{ matrix.project }}
          path: test-results/contrast/
          if-no-files-found: ignore
          retention-days: 30

  # ADR-010: the header, CSP and asset specs against dist/ served by the generated nginx and Caddy configurations, and
  # the GitHub Pages build served with no headers; each at the root and under a path.
  deploy-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host: [nginx, caddy, github-pages]

    services:
      s3:
        image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a # 1.0.6
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: coffer-test-key
          RUSTFS_SECRET_KEY: coffer-test-secret-not-real
          RUSTFS_CONSOLE_ENABLE: "false"
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Served at the root (${{ matrix.host }})
        run: pnpm test:deploy
        env:
          COFFER_DEPLOY_HOST: ${{ matrix.host }}

      - name: Served under a path (${{ matrix.host }})
        run: pnpm test:deploy && pnpm dist:check && pnpm size:check
        env:
          COFFER_DEPLOY_HOST: ${{ matrix.host }}
          COFFER_BASE: /coffer/

  # Lighthouse against the production build served gzip-compressed with its real _headers, on a mobile profile.
  # Budgets are in scripts/lighthouse/budgets.ts (technical-spec 14); a page over budget fails the job.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      s3:
        image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a # 1.0.6
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: coffer-test-key
          RUSTFS_SECRET_KEY: coffer-test-secret-not-real
          RUSTFS_CONSOLE_ENABLE: "false"
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Lighthouse (Welcome, Unlock, Files)
        run: pnpm lighthouse

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7

  e2e-report:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports and list flaky tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
        run: |
          pnpm exec playwright merge-reports --reporter=html,json ./all-blob-reports
          node scripts/ci/e2e-summary.ts e2e-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
