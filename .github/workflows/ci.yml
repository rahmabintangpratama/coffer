name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Local S3 fixture for the integration tests. Fake credentials only.
    # Same image and settings as tests/integration/docker-compose.yml (C-48).
    services:
      s3:
        image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a # 1.0.6
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: coffer-test-key
          RUSTFS_SECRET_KEY: coffer-test-secret-not-real
          RUSTFS_CONSOLE_ENABLE: "false"
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            from="$PR_BASE"; to="$PR_HEAD"
          else
            from="$PUSH_BEFORE"; to="$PUSH_HEAD"
          fi
          # A new branch or a base that is not in the clone: check the tip commit only.
          if ! git cat-file -e "${from}^{commit}" 2>/dev/null; then from="${to}~1"; fi
          pnpm exec commitlint --from "$from" --to "$to" --verbose

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Copy keys
        run: pnpm copy:check

      - name: Token CSS is current
        run: pnpm tokens:check

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Bundle budgets
        run: pnpm size:check

      - name: Security headers
        run: pnpm headers:check

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
