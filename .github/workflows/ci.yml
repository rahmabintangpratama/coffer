name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Local S3 fixture for the integration tests. Fake credentials only.
    # Same image as tests/integration/docker-compose.yml (see OQ-32).
    services:
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: coffer-test-key
          MINIO_ROOT_PASSWORD: coffer-test-secret-not-real
          MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/ready"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Copy keys
        run: pnpm copy:check

      - name: Token CSS is current
        run: pnpm tokens:check

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Security headers
        run: pnpm headers:check

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
