# Git hooks. Installed by `pnpm install` (the prepare script).
# Never bypass them with --no-verify (AGENTS.md, Git).
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# Runs before a push. `pnpm gates` chains the local gates with && so a failing
# step stops the push and no later step can hide it.
pre-push:
  commands:
    checks:
      run: pnpm gates
