# Local S3 fixture for integration and end-to-end tests. Fake credentials only:
# never put real cloud credentials in this repository (tests/AGENTS.md).
#
# The official minio/minio images are no longer published, so this uses the
# frozen bitnamilegacy/minio image (MinIO 2025.7.23). It is a test fixture, not
# something to run with real data. See OQ-32 in docs/open-questions.md.
name: coffer-test

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: coffer-test-key
      MINIO_ROOT_PASSWORD: coffer-test-secret-not-real
      # Allows the Vite dev server origin for browser tests.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
